# Inner Sanctuary Wellness Foundation — Netlify Deployment Configuration

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

# Netlify Redirects — Apex HTTPS Canonical Routing (Zero Redirect Loops)
[[redirects]]
  from = "http://innersanctuarywellnessfoundation.org/*"
  to = "https://innersanctuarywellnessfoundation.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.innersanctuarywellnessfoundation.org/*"
  to = "https://innersanctuarywellnessfoundation.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.innersanctuarywellnessfoundation.org/*"
  to = "https://innersanctuarywellnessfoundation.org/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(self), geolocation=()"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
